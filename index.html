<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#780214">
  <meta name="description" content="LEB EATS. Coming soon.">
  <title>LEB EATS | Coming soon</title>
  <link rel="icon" href="../assets/logo.png">
  <style>
    * { box-sizing: border-box; }
    html { background: #780214; color: #fff; }
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    main { min-height: max(100vh, 620px); min-height: max(100svh, 620px); display: grid; place-items: center; padding: 0 24px; }
    .brand { position: relative; width: clamp(168px, 44vw, 280px); }
    svg { display: block; width: 100%; height: auto; overflow: hidden; border-radius: 9%; }
    .details { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); width: min(340px, calc(100vw - 40px)); text-align: center; }
    h1 { margin: 20px 0 16px; font-size: clamp(18px, 2.5vw, 22px); line-height: 1.4; }
    button, input { border-radius: 24px; font: inherit; min-height: 44px; }
    button { padding: 10px 20px; background: #fff; border: 1px solid #fff; color: #780214; font-weight: 700; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    form { display: grid; gap: 10px; justify-items: center; }
    [hidden] { display: none; }
    input { width: 100%; padding: 10px 16px; border: 1px solid #fff; color: #fff; background: transparent; }
    input::placeholder { color: #fff; opacity: .82; }
    #status { margin: 0; font-size: 15px; }
    @media (max-height: 620px) { main { min-height: 100svh; padding: 36px 20px; } .brand { width: min(340px, 100%); display: grid; justify-items: center; } .details { position: static; width: 100%; transform: none; } svg { width: 140px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="280 313 532 460" role="img" aria-labelledby="logo-title">
        <title id="logo-title">LEB EATS</title>
        <image href="../assets/leb-eats-brand.png" width="1080" height="1080" />
      </svg>
      <div class="details">
        <h1>Coming soon</h1>
        <button id="signup" type="button" aria-controls="email-form" aria-expanded="false">Sign up now</button>
        <form id="email-form" hidden>
          <input id="email" type="email" aria-label="Email address" placeholder="Email address" autocomplete="email" required>
          <button type="submit">Enter your email</button>
        </form>
        <p id="status" role="status"></p>
      </div>
    </div>
  </main>
  <script>
    const signup = document.getElementById("signup");
    const form = document.getElementById("email-form");
    const email = document.getElementById("email");
    signup.addEventListener("click", () => {
      signup.setAttribute("aria-expanded", "true");
      signup.hidden = true;
      form.hidden = false;
      email.focus();
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      form.reset();
      form.hidden = true;
      document.getElementById("status").textContent = "Signups open soon. Thanks for your interest!";
    });
  </script>
</body>
</html>
