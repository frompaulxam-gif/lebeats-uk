<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#780214">
  <meta name="description" content="Order from LEB EATS on Uppingham Road in Leicester, follow us on Instagram and TikTok, or get in touch.">
  <title>LEB EATS | Coming soon</title>
  <link rel="icon" href="../assets/logo.png">
  <style>
    * { box-sizing: border-box; }
    html { background: #780214; color: #fff; }
    body { margin: 0; font: 16px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 42px 20px; }
    .brand { width: min(100%, 370px); text-align: center; }
    .brand > svg { display: block; width: clamp(126px, 32vw, 158px); height: auto; margin: auto; border-radius: 9%; overflow: hidden; }
    .bio { margin: 16px 0 0; font-size: 18px; font-weight: 700; }
    address { margin: 2px 0 24px; font-style: normal; font-size: 14px; color: #ffe4e5; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    nav a, button, input { min-height: 46px; border-radius: 15px; font: inherit; }
    nav a { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 12px 16px; color: white; font-weight: 650; text-decoration: none; background: #ffffff0d; border: 1px solid #ffffff55; }
    nav a::after { content: "↗"; font-size: 16px; font-weight: 400; }
    nav a.order { grid-column: 1 / -1; background: #fff; color: #510615; border-color: #fff; }
    nav a:hover { background: #ffffff24; } nav a.order:hover, button:hover { background: #ffe5e8; }
    .details { margin-top: 23px; padding-top: 17px; border-top: 1px solid #ffffff45; }
    h1 { margin: 0 0 10px; font-size: 20px; line-height: 1.3; }
    button { padding: 9px 20px; border: 0; border-radius: 24px; background: #fff; color: #780214; font-weight: 700; cursor: pointer; }
    :is(a, button, input):focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    form { display: grid; gap: 9px; justify-items: center; }
    [hidden] { display: none; }
    input { width: 100%; padding: 10px 16px; border: 1px solid #fff; color: #fff; background: transparent; }
    input::placeholder { color: #fff; opacity: .82; }
    #status { margin: 0; font-size: 15px; }
    @media (max-width: 350px) { nav a { padding-inline: 12px; font-size: 15px; } }
    @media (max-height: 660px) { main { padding-block: 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="280 313 532 460" role="img" aria-labelledby="logo-title">
        <title id="logo-title">LEB EATS</title>
        <image href="../assets/leb-eats-brand.png" width="1080" height="1080" />
      </svg>
      <p class="bio">Leicester Lebanese Grill</p>
      <address>197 Uppingham Road, Leicester, LE5 4BQ</address>
      <nav aria-label="Order, follow and contact LEB EATS">
        <a class="order" href="https://www.ubereats.com/store/leb-eats/daoqcZHZTGej6fD-toGRIg">Order on Uber Eats</a>
        <a class="order" href="https://deliveroo.co.uk/menu/leicester/evington-valley/leb-eats-197-uppingham-road">Order on Deliveroo</a>
        <a href="https://www.instagram.com/lebeatsuk">Instagram</a>
        <a href="https://www.tiktok.com/@lebeatsuk">TikTok</a>
        <a href="mailto:lebeatsuk@gmail.com">Email us</a>
        <a href="https://share.google/FJBIpbPd4rjr58xO9">Leave a review</a>
      </nav>
      <div class="details">
        <h1>Coming soon</h1>
        <button id="signup" type="button" aria-controls="email-form" aria-expanded="false">Sign up now</button>
        <form id="email-form" hidden>
          <input id="email" type="email" aria-label="Email address" placeholder="Email address" autocomplete="email" required>
          <button type="submit">Enter your email</button>
        </form>
        <p id="status" role="status"></p>
      </div>
    </div>
  </main>
  <script>
    const signup = document.getElementById("signup");
    const form = document.getElementById("email-form");
    const email = document.getElementById("email");
    signup.addEventListener("click", () => {
      signup.setAttribute("aria-expanded", "true");
      signup.hidden = true;
      form.hidden = false;
      email.focus();
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      form.reset();
      form.hidden = true;
      document.getElementById("status").textContent = "Signups open soon. Thanks for your interest!";
    });
  </script>
</body>
</html>
